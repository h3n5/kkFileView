name: Java CI with Maven manual build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  KKFILEVIEW_VERSION: 4.4.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn -B package -Dmaven.test.skip=true --file pom.xml

      - name: Upload Linux distribution package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kkfileview-linux
          path: server/target/*.tar.gz
          retention-days: 7

      - name: Upload Windows distribution package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kkfileview-windows
          path: server/target/*.zip
          retention-days: 7

      - name: Set up Docker Buildx
        if: success()
        uses: docker/setup-buildx-action@v3

      # kkfileview Dockerfile depends on this base image
      - name: Build kkfileview base image
        if: success()
        run: |
          docker build \
            --tag keking/kkfileview-base:${{ env.KKFILEVIEW_VERSION }} \
            --file docker/base/Dockerfile \
            docker/base

      - name: Prepare Linux package
        if: success()
        run: |
          cp server/target/*.tar.gz kkfileview.tar.gz

          echo "Prepared package:"
          ls -lh kkfileview.tar.gz

      - name: Build kkfileview Docker image
        if: success()
        run: |
          docker buildx build \
            --load \
            --tag kkfileview:${{ env.KKFILEVIEW_VERSION }} \
            --file Dockerfile \
            --build-arg LINUX_PACKAGE=kkfileview.tar.gz \
            .

      - name: Verify Docker image
        if: success()
        run: |
          docker images kkfileview:${{ env.KKFILEVIEW_VERSION }}

      - name: Save Docker image
        if: success()
        run: |
          docker save kkfileview:${{ env.KKFILEVIEW_VERSION }} \
            | gzip > kkfileview-${{ env.KKFILEVIEW_VERSION }}-docker-image.tar.gz

      - name: Upload Docker image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kkfileview-${{ env.KKFILEVIEW_VERSION }}-docker-image
          path: kkfileview-${{ env.KKFILEVIEW_VERSION }}-docker-image.tar.gz
          retention-days: 7
